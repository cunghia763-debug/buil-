name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - VanNghia.zip
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -euo pipefail
          # Kiểm tra file zip tồn tại
          if [ ! -f VanNghia.zip ]; then
            echo "Lỗi: Không tìm thấy file VanNghia.zip"
            exit 1
          fi
          
          mkdir source
          ditto -x -k VanNghia.zip source
          
          # Kiểm tra xem thư mục VanNghia có tồn tại sau khi giải nén không
          if [ ! -d "source/VanNghia" ]; then
            echo "Lỗi: Không tìm thấy thư mục source/VanNghia sau khi giải nén."
            echo "Nội dung thư mục source:"
            ls -la source/
            exit 1
          fi
          
          # Cấp quyền thực thi cho các script (nếu có)
          chmod +x source/VanNghia/build_unsigned.sh || true
          chmod +x source/VanNghia/build_esign_ready_ipa.sh || true

      - name: Repair Xcode project paths
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          # Đường dẫn đến project.pbxproj (đã sửa thành VanNghia)
          project = Path("source/VanNghia/ThreeOneOSFive.xcodeproj/project.pbxproj")
          if not project.exists():
              print(f"LỖI: Không tìm thấy project.pbxproj tại {project}")
              # Thử tìm kiếm nếu đường dẫn khác
              for p in Path("source").rglob("project.pbxproj"):
                  print(f"Tìm thấy project.pbxproj tại: {p}")
              sys.exit(1)

          text = project.read_text()

          pattern = r'path = (ThreeOneOSFive/Patches/OGIOS File \(\d+\)\.3105);'
          matches = re.findall(pattern, text)

          if matches:
              text = re.sub(pattern, r'path = "\1";', text)
              print(f"[FIX] Đã thêm dấu ngoặc kép cho {len(matches)} đường dẫn:")
              for m in matches:
                  print(f"      - {m}")
          else:
              fixed_pattern = r'path = "ThreeOneOSFive/Patches/OGIOS File \(\d+\)\.3105";'
              already = re.findall(fixed_pattern, text)
              if already:
                  print(f"[OK] Tất cả đường dẫn đã có dấu ngoặc kép ({len(already)} tìm thấy)")
              else:
                  print("[CẢNH BÁO] Không tìm thấy đường dẫn OGIOS File (N).3105 trong project.pbxproj")
                  print("[CẢNH BÁO] Tiếp tục - dự án có thể có cấu trúc khác")

          project.write_text(text)
          print("[DONE] Đã cập nhật project.pbxproj")
          PY

      - name: Build unsigned IPA
        working-directory: source/VanNghia
        run: ./build_unsigned.sh

      - name: Verify IPA
        working-directory: source/VanNghia
        run: ./build_esign_ready_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HYper-Regedit-Key-Enabled-unsigned-ipa
          path: source/VanNghia/build/HYper-Regedit-Key-Enabled-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
