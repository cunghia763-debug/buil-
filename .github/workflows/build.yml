name: Build 3105

on: 
  workflow_dispatch:

jobs: 
  build: 
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén source
        run: |
          unzip -o 3105-1.0.1.zip
          echo "--- Danh sách thư mục gốc ---"
          ls -la
          echo "--- Danh sách thư mục 3105-1.0.1 ---"
          ls -la 3105-1.0.1/ || echo "Không tìm thấy thư mục 3105-1.0.1"

      - name: Kiểm tra Scheme có sẵn
        run: |
          cd 3105-1.0.1
          echo "--- Liệt kê các scheme có sẵn ---"
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build Release
        run: |
          cd 3105-1.0.1
          # Sửa tên scheme cho khớp với project. Nếu tên khác, hãy thay đổi ở đây.
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean archive \
                     -archivePath build/3105.xcarchive

      - name: Tạo IPA từ .xcarchive
        run: |
          cd 3105-1.0.1
          
          # Tìm file .app thực tế được tạo ra trong archive
          APP_PATH=$(find build/3105.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy file .app trong archive!"
            exit 1
          fi
          
          echo "Đã tìm thấy app tại: $APP_PATH"
          
          # Tạo thư mục Payload và copy app vào
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Lấy tên file .app để đặt tên cho IPA (không cần phần mở rộng)
          APP_NAME=$(basename "$APP_PATH" .app)
          
          # Nén thành IPA
          zip -r "build/${APP_NAME}.ipa" Payload/
          
          echo "Đã tạo IPA: build/${APP_NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          # Đường dẫn này sẽ tìm tất cả file .ipa trong thư mục build
          path: 3105-1.0.1/build/*.ipa
